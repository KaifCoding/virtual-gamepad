name: Build Windows Host

on:
  push:
    branches: [main]
    paths: ["windows-app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Name
        id: get_version
        shell: pwsh
        working-directory: . # OVERRIDE: Runs at root level so 'git' commands can see the .git folder
        run: |
          $commitMsg = git log -1 --pretty=%B
          # Safely extract the version pattern without crashing if it's missing
          $versionMatch = [regex]::Match($commitMsg, 'v\d+\.\d+\.\d+(-\w+)?|\d+\.\d+\.\d+')
          
          if ($versionMatch.Success) {
              $version = $versionMatch.Value
          } else {
              $version = "latest"
          }
          
          $fileVersion = $version -replace '\.', '-'
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FILE_VERSION=$fileVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish App Binary
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer Package
        run: iscc .\installer\setup.iss

      # Updates the file dynamically to use your custom build output pattern
      - name: Rename Windows Installer
        shell: pwsh
        run: |
          Rename-Item -Path "dist/VirtualGamepadHost-Setup.exe" -NewName "virtualGamepad-${{ env.FILE_VERSION }}.exe"

      - name: Upload Raw Installer to GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.VERSION }} --title "Virtual Gamepad ${{ env.VERSION }}" --notes "Production rolling build." 2>$null
          gh release upload ${{ env.VERSION }} dist/virtualGamepad-${{ env.FILE_VERSION }}.exe --clobber