name: Build Windows Host

on:
  push:
    branches: [main]
    paths: ["windows-app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write # Grants write token execution to safely declare GitHub Releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4

      - name: Extract Version Name
        id: get_version
        shell: pwsh
        working-directory: . # OVERRIDE: Runs at root level so git can read the commit log safely
        run: |
          $commitMsg = git log -1 --pretty=%B
          $versionMatch = [regex]::Match($commitMsg, 'v\d+\.\d+\.\d+(-\w+)?|\d+\.\d+\.\d+')
          
          if ($versionMatch.Success) {
              $tag = $versionMatch.Value
          } else {
              $tag = "v0.0.1"
          }
          
          $cleanVersion = $tag -replace '^v', ''
          $fileVersion = $cleanVersion -replace '\.', '-'
          
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FILE_VERSION=$fileVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish App Binary
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer Package
        run: iscc .\installer\setup.iss

      - name: Rename Windows Installer
        shell: pwsh
        run: |
          Rename-Item -Path "dist/VirtualGamepadHost-Setup.exe" -NewName "virtualGamepad-${{ env.FILE_VERSION }}.exe"

      # Uploads the raw, unzipped Setup installer directly to your target release zone
      - name: Upload Raw Installer to GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} --title "Virtual Gamepad ${{ env.RELEASE_TAG }}" --notes "Production stable binaries." 2>$null
          gh release upload ${{ env.RELEASE_TAG }} dist/virtualGamepad-${{ env.FILE_VERSION }}.exe --clobber
