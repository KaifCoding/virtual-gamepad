name: Build Windows Host

on:
  push:
    branches: [main]
    paths: ["windows-app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write # Grants write token execution to safely declare GitHub Releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish App Binary
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Copy icon into publish output (needed by the installer script)
        run: Copy-Item app_icon.ico publish\app_icon.ico
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer Package
        run: iscc .\installer\setup.iss

      # Uses native Windows PowerShell GitHub CLI to upload the EXE safely without clearing out the Android APK
      - name: Upload Raw Installer to GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest --title "Virtual Gamepad - Latest Build" --notes "Automated rolling builds." 2>$null
          gh release upload latest dist/VirtualGamepadHost-Setup.exe --clobber