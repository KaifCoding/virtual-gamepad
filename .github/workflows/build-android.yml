name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold native android/ project (safe to re-run)
        run: flutter create --platforms=android --org in.atomprod .

      - name: Apply our AndroidManifest (permissions + orientation)
        run: cp manifest-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Force application ID to in.atomprod.vgamepad
        shell: bash
        run: |
          set -e
          GRADLE_KTS="android/app/build.gradle.kts"
          GRADLE_GROOVY="android/app/build.gradle"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i -E 's/(applicationId\s*=\s*)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_KTS"
            sed -i -E 's/(namespace\s*=\s*)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_KTS"
          elif [ -f "$GRADLE_GROOVY" ]; then
            sed -i -E 's/(applicationId\s+)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_GROOVY"
            sed -i -E 's/(namespace\s+)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_GROOVY"
          else
            echo "Could not find app/build.gradle(.kts)" >&2
            exit 1
          fi

          # The applicationId/namespace above are plain Gradle string values,
          # so "in" needs no special handling there. MainActivity.kt is real
          # Kotlin source though, where "in" IS a reserved keyword (for...in,
          # x in y) - its package line needs backtick-escaping, and it also
          # has to physically live at the matching directory path or Android
          # can't find the launcher activity at runtime and crashes on open.
          MAIN_ACTIVITY=$(find android/app/src/main -type f \( -iname "MainActivity.kt" -o -iname "MainActivity.java" \) | head -n1)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "Could not find MainActivity.kt/.java" >&2
            exit 1
          fi

          SRC_ROOT=$(echo "$MAIN_ACTIVITY" | sed -E 's#(android/app/src/main/(kotlin|java))/.*#\1#')
          EXT="${MAIN_ACTIVITY##*.}"
          NEW_DIR="$SRC_ROOT/in/atomprod/vgamepad"
          NEW_PATH="$NEW_DIR/MainActivity.$EXT"

          mkdir -p "$NEW_DIR"

          if [ "$(readlink -f "$MAIN_ACTIVITY")" != "$(readlink -f "$NEW_DIR")/MainActivity.$EXT" ]; then
            mv "$MAIN_ACTIVITY" "$NEW_PATH"
          else
            echo "MainActivity already at target location, skipping move"
          fi

          # .java files use "in" as a plain (non-reserved) package segment,
          # no backticks. .kt files need `in` backtick-escaped since it's a
          # reserved Kotlin keyword.
          if [ "$EXT" = "kt" ]; then
            sed -i -E "s/^package .*/package \`in\`.atomprod.vgamepad/" "$NEW_PATH"
          else
            sed -i -E "s/^package .*/package in.atomprod.vgamepad;/" "$NEW_PATH"
          fi

          echo "MainActivity moved to: $NEW_PATH"
          cat "$NEW_PATH"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK for release
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/VirtualGamepad-${{ env.FILE_VERSION }}.apk
      - name: Upload Raw APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.VERSION }} --title "Virtual Gamepad ${{ env.VERSION }}" --notes "Production rolling build." || true
          gh release upload ${{ env.VERSION }} build/app/outputs/flutter-apk/VirtualGamepad-${{ env.FILE_VERSION }}.apk --clobber