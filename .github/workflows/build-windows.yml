name: Build Windows Host

on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:

permissions:
  contents: write # Grants write token execution to safely declare GitHub Releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4

      - name: Extract Version Name
        id: get_version
        shell: pwsh
        working-directory: .
        run: |
          # 1. Read and parse the version string from your JSON file
          $json = Get-Content -Raw -Path "version.json" | ConvertFrom-Json
          $rawVersion = $json.version
          
          # 2. Format the tag (ensures it has a 'v' prefix if it doesn't already)
          if ($rawVersion -like 'v*') {
              $tag = $rawVersion
          } else {
              $tag = "v$rawVersion"
          }
          
          # 3. Create the clean and hyphenated versions for your files
          $cleanVersion = $tag -replace '^v', ''
          $fileVersion = $cleanVersion -replace '\.', '-'
          
          # 4. Append to GITHUB_ENV exactly like before
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FILE_VERSION=$fileVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish App Binary
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer Package
        run: iscc .\installer\setup.iss

      - name: Rename Windows Installer
        shell: pwsh
        run: |
          Rename-Item -Path "dist/VirtualGamepadHost-Setup.exe" -NewName "VirtualGamepadHost-v${{ env.FILE_VERSION }}.exe"

      # Uploads the raw, unzipped Setup installer directly to your target release zone
      - name: Upload Raw Installer to GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} --title "Virtual Gamepad ${{ env.RELEASE_TAG }}" --notes "Production stable binaries." 2>$null
          gh release upload ${{ env.RELEASE_TAG }} dist/VirtualGamepadHost-v${{ env.FILE_VERSION }}.exe --clobber
