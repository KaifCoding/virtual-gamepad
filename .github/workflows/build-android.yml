name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write # Required to securely post assets to GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold native android/ project (safe to re-run)
        run: flutter create --platforms=android --org in.atomprod .

      - name: Apply our AndroidManifest (permissions + orientation)
        run: cp manifest-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Force application ID to in.atomprod.vgamepad
        shell: bash
        run: |
          set -e
          GRADLE_KTS="android/app/build.gradle.kts"
          GRADLE_GROOVY="android/app/build.gradle"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i -E 's/(applicationId\s*=\s*)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_KTS"
            sed -i -E 's/(namespace\s*=\s*)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_KTS"
          elif [ -f "$GRADLE_GROOVY" ]; then
            sed -i -E 's/(applicationId\s+)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_GROOVY"
            sed -i -E 's/(namespace\s+)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_GROOVY"
          else
            echo "Could not find app/build.gradle(.kts)" >&2
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      # Rename step to swap the generic output name for your custom one
      - name: Rename APK for release
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/VirtualGamepad.apk

      # Uploads to a single, fixed "latest" release that both this workflow
      # and build-windows.yml update in place - so the release always ends
      # up with BOTH files attached, regardless of which one ran most
      # recently. (github.run_number is per-workflow, so using it as the
      # tag here would make Android and Windows collide on tags like "v5"
      # for unrelated builds - a fixed tag avoids that entirely.)
      - name: Upload Raw APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Virtual Gamepad - Latest Build"
          draft: false
          prerelease: false
          files: android-app/build/app/outputs/flutter-apk/VirtualGamepad.apk