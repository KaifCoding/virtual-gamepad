name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write # Required to securely post assets to GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold native android/ project (safe to re-run)
        run: flutter create --platforms=android --org com.virtualgamepad .

      - name: Apply our AndroidManifest (permissions + orientation)
        run: cp manifest-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      # Rename step to swap the generic output name for your custom one
      - name: Rename APK for release
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/VirtualGamepad-v0-4-5.apk

      # Uploads the custom-named raw APK straight to your repository Releases page
      - name: Upload Raw APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Virtual Gamepad Android Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: android-app/build/app/outputs/flutter-apk/VirtualGamepad-v0-4-5.apk