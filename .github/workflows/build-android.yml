name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write # Required to create/update releases and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold native android/ project (safe to re-run)
        run: flutter create --platforms=android --org com.virtualgamepad .

      - name: Apply our AndroidManifest (permissions + orientation)
        run: cp manifest-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      # Optional: Keeps the zip in your Actions run if you still want it there
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-gamepad-android
          path: android-app/build/app/outputs/flutter-apk/app-release.apk

      # Fix: Uploads the raw, unzipped .apk straight to your repository Releases page
      - name: Upload Raw APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Virtual Gamepad Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: android-app/build/app/outputs/flutter-apk/app-release.apk