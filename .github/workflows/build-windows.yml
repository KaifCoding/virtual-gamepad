name: Build Windows Host

on:
  push:
    branches: [main]
    paths: ["windows-app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write # Grants write token execution to safely declare GitHub Releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish App Binary
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Copy icon into publish output (needed by the installer script)
        run: Copy-Item app_icon.ico publish\app_icon.ico
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer Package
        run: iscc .\installer\setup.iss

      # Same fixed "latest" tag as build-android.yml - both workflows update
      # this one release in place, so it always carries both files together
      # instead of forking into separate v-number releases that only ever
      # have one file each.
      - name: Upload Raw Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Virtual Gamepad - Latest Build"
          draft: false
          prerelease: false
          files: windows-app/dist/VirtualGamepadHost-Setup.exe