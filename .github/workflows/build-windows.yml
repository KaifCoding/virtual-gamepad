name: Build Windows Host

on:
  push:
    branches: [main]
    paths: ["windows-app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write # Required to securely post assets to GitHub Releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish App Binary
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      # Automatically installs Inno Setup inside the CI environment runner path
      - name: Install Inno Setup
        run: choco install innosetup -y

      # Compiles your installer using your optimized .iss configuration file
      - name: Build Installer Package
        run: iscc installer.iss

      # Uploads the raw, unzipped Setup.exe straight to your repository Releases page
      - name: Upload Raw Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Virtual Gamepad Host Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          # Points exactly to where your ISS script maps the OutputDir file output
          files: dist/VirtualGamepadHost-Setup.exe