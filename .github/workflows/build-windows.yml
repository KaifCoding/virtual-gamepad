name: Build Windows Host
on:
  push:
    branches: [main]
    paths: ["windows-app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write # Grants write token execution to safely declare GitHub Releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish App Binary
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer Package
        run: iscc .\installer\setup.iss

      # FIX: Uses PowerShell's Rename-Item and correct local paths relative to the working-directory
      - name: Rename Installer for release
        run: |
          Rename-Item -Path "dist/VirtualGamepadHost-Setup.exe" -NewName "VirtualGamepadHost-Setup-v0-${{ github.run_number }}.exe"

      # Uploads the raw, unzipped Setup installer directly to your target release zone
      - name: Upload Raw Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Virtual Gamepad Host Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          # Keeps the windows-app/ prefix required by the action outside the working-directory context
          files: windows-app/dist/VirtualGamepadHost-Setup-v0-${{ github.run_number }}.exe
