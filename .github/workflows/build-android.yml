name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      - name: Extract and Inject Version from JSON
        id: get_version
        run: |
          # 1. Read values from version.json
          VERSION_NAME=$(jq -r '.version' ../version.json)
          VERSION_CODE=${{github.run_number}}
          
          # Combine them into Flutter's format (e.g., 1.0.0+1)
          FLUTTER_VERSION="${VERSION_NAME}+${VERSION_CODE}"
          echo "Target Version: $FLUTTER_VERSION"
          
          # 2. Update the version line in pubspec.yaml inline
          sed -i "s/^version: .*/version: $FLUTTER_VERSION/" pubspec.yaml
          
          # 3. Create standardized variables (prepending 'v' to match Windows)
          if [[ "$VERSION_NAME" == v* ]]; then
            RELEASE_TAG="$VERSION_NAME"
            CLEAN_VERSION="${VERSION_NAME#v}"
          else
            RELEASE_TAG="v$VERSION_NAME"
            CLEAN_VERSION="$VERSION_NAME"
          fi
          
          FILE_VERSION=$(echo "$CLEAN_VERSION" | tr '.' '-')
          
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "FILE_VERSION=$FILE_VERSION" >> $GITHUB_ENV

      - name: Scaffold native android/ project (safe to re-run)
        run: flutter create --platforms=android --org in.atomprod .

      - name: Apply our AndroidManifest (permissions + orientation)
        run: cp manifest-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      # ================= DECODE AND CONFIGURE SIGNING KEY =================
      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

      - name: Configure Gradle Signing Properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-key.jks
          EOF
      # =========================================================================

      - name: Force application ID and Inject Signing Configs
        shell: bash
        run: |
          set -e
          GRADLE_KTS="android/app/build.gradle.kts"
          GRADLE_GROOVY="android/app/build.gradle"
          
          # ---- DYNAMIC GRADLE GROOVY SIGNING INJECTION ----
          if [ -f "$GRADLE_GROOVY" ]; then
            sed -i '1s/^/def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n/' "$GRADLE_GROOVY"
            
            sed -i '/signingConfigs {/a\
                release {\
                    keyAlias keystoreProperties["keyAlias"]\
                    keyPassword keystoreProperties["keyPassword"]\
                    storeFile file(keystoreProperties["storeFile"])\
                    storePassword keystoreProperties["storePassword"]\
                }' "$GRADLE_GROOVY"
            
            sed -i '/buildTypes {/,/}/ {
              /release {/,/}/ s/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/
            }' "$GRADLE_GROOVY"
          fi
          # -----------------------------------------------------

          if [ -f "$GRADLE_KTS" ]; then
            sed -i -E 's/(applicationId\s*=\s*)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_KTS"
            sed -i -E 's/(namespace\s*=\s*)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_KTS"
          elif [ -f "$GRADLE_GROOVY" ]; then
            sed -i -E 's/(applicationId\s+)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_GROOVY"
            sed -i -E 's/(namespace\s+)"[^"]*"/\1"in.atomprod.vgamepad"/' "$GRADLE_GROOVY"
          else
            echo "Could not find app/build.gradle(.kts)" >&2
            exit 1
          fi

          MAIN_ACTIVITY=$(find android/app/src/main -type f \( -iname "MainActivity.kt" -o -iname "MainActivity.java" \) | head -n1)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "Could not find MainActivity.kt/.java" >&2
            exit 1
          fi

          SRC_ROOT=$(echo "$MAIN_ACTIVITY" | sed -E 's#(android/app/src/main/(kotlin|java))/.*#\1#')
          EXT="${MAIN_ACTIVITY##*.}"
          NEW_DIR="$SRC_ROOT/in/atomprod/vgamepad"
          NEW_PATH="$NEW_DIR/MainActivity.$EXT"

          mkdir -p "$NEW_DIR"

          if [ "$(readlink -f "$MAIN_ACTIVITY")" != "$(readlink -f "$NEW_DIR")/MainActivity.$EXT" ]; then
            mv "$MAIN_ACTIVITY" "$NEW_PATH"
          else
            echo "MainActivity already at target location, skipping move"
          fi

          if [ "$EXT" = "kt" ]; then
            sed -i -E "s/^package .*/package \`in\`.atomprod.vgamepad/" "$NEW_PATH"
          else
            sed -i -E "s/^package .*/package in.atomprod.vgamepad;/" "$NEW_PATH"
          fi

          echo "MainActivity moved to: $NEW_PATH"

      - name: Build release APK
        run: flutter build apk --release --build-name=${{ env.VERSION_NAME }} --build-number=${{ github.run_number }}

      - name: Rename APK for release
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/VirtualGamepad-v${{ env.FILE_VERSION }}.apk

      - name: Upload Raw APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} --title "Virtual Gamepad ${{ env.RELEASE_TAG }}" --notes "Production rolling build." || true
          gh release upload ${{ env.RELEASE_TAG }} build/app/outputs/flutter-apk/VirtualGamepad-v${{ env.FILE_VERSION }}.apk --clobber